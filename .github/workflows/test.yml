name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zsh, ripgrep and ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck ripgrep jq iproute2
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning -s bash .bashrc .shellrc .functions .exports .redpill/lib/*.sh
      - name: Bash and Zsh syntax
        run: |
          for file in .bashrc .shellrc .functions .exports .redpill/lib/*.sh; do bash -n "$file"; done
          for file in .zshrc .shellrc .functions .exports .redpill/lib/*.sh; do zsh -n "$file"; done
      # Commit and release verified against the official annotated 0.50.1 tag.
      - uses: TypedDevs/bashunit@8d4f357f52df7596f92ece2d6c049d91d45517a2 # 0.52.0
        with:
          version: '0.50.1'
          verify-checksum: 'true'
      - name: Bash and Zsh activation contracts
        run: bashunit test tests/shell --strict
