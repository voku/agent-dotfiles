name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q agent_dotfiles bin tests tools
      - name: Contract tests
        run: |
          test_status=0
          python -m unittest discover -s tests -v > contract-tests.log 2>&1 || test_status=$?
          cat contract-tests.log
          exit "$test_status"
      - name: Capability diagnostics
        if: always()
        run: python bin/agent-dotfiles doctor > capabilities.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-${{ matrix.python-version }}-diagnostics
          path: |
            contract-tests.log
            capabilities.json

  macos-installation:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Installation, Bash and Zsh source contracts on macOS
        env:
          REQUIRE_ZSH: "1"
        run: python -m unittest discover -s tests -v

  bashunit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Commit and release verified against the official annotated 0.50.1 tag.
      - uses: TypedDevs/bashunit@860c797a48e34be20b019a70f58c0e06d15c8d33 # 0.51.0
        with:
          version: '0.50.1'
          verify-checksum: 'true'
      - name: Bashunit real-CLI integration tests
        run: bashunit test tests/shell --strict

  shell-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install independent shell validators
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - name: ShellCheck and Bash/Zsh syntax
        run: |
          shellcheck --severity=warning -s sh install.sh
          shellcheck --severity=warning -s bash .bashrc .shellrc .functions .exports shell/modules/context.sh shell/modules/git.sh shell/core/activation.sh shell/core/deactivation.sh
          for file in .bashrc .shellrc .functions .exports shell/modules/context.sh shell/modules/git.sh shell/core/activation.sh shell/core/deactivation.sh; do bash -n "$file"; done
          for file in .zshrc .shellrc .functions .exports shell/modules/context.sh shell/modules/git.sh shell/core/activation.sh shell/core/deactivation.sh; do zsh -n "$file"; done
      - name: Actual Bash and Zsh activation contracts
        env:
          REQUIRE_ZSH: "1"
        run: python -m unittest discover -s tests -p test_shell_profiles.py -v

  candidate-cold-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # PR checks should test the reviewed PR source, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install Zsh for a fresh consumer
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Verify candidate source, install, activate, verify and uninstall
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          # Keep receipts outside the checkout. These are attached on failures
          # too, so a red job can be diagnosed without guessing which gate failed.
          root="$RUNNER_TEMP/agent-dotfiles-cold-evidence"
          mkdir -p "$root"
          prefix="$root/consumer"
          ./install.sh plan --prefix "$prefix" --revision "$CANDIDATE_SHA" > "$root/plan.json"
          test ! -e "$prefix"

          ./install.sh --prefix "$prefix" --revision "$CANDIDATE_SHA" > "$root/install.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] is True and r["operation"] == "install" and r["source_revision"] == sys.argv[2]' "$root/install.json" "$CANDIDATE_SHA"
          ./install.sh verify --prefix "$prefix" --revision "$CANDIDATE_SHA" > "$root/verify-before.json"
          "$prefix/bin/agent-dotfiles" doctor > "$root/direct-doctor.json"
          cp "$prefix/installation.json" "$root/manifest.json"
          python3 - "$root/plan.json" "$root/manifest.json" "$CANDIDATE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          manifest = json.loads(Path(sys.argv[2]).read_text())
          assert plan["operation"] == "plan"
          assert plan["source_revision"] == sys.argv[3] == manifest["source_revision"]
          assert plan["entries"] == manifest["files"], "preview differs from installed payload"
          required = {
              ".bashrc", ".zshrc", ".shellrc",
              "shell/core/activation.sh", "shell/core/deactivation.sh",
              "shell/modules/context.sh", "shell/modules/git.sh",
          }
          assert required.issubset(plan["entries"]), "required shell assets missing"
          PY

          env -u BASH_ENV bash --noprofile --norc -c '. "$1/.bashrc" || exit $?; agent_doctor || exit $?; agent_deactivate' fresh-bash "$prefix" > "$root/bash-doctor.json"
          env -u ZDOTDIR zsh -f -c 'source "$1/.zshrc" || exit $?; agent_doctor || exit $?; agent_deactivate' fresh-zsh "$prefix" > "$root/zsh-doctor.json"
          for report in "$root/direct-doctor.json" "$root/bash-doctor.json" "$root/zsh-doctor.json"; do
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"] == "agent-dotfiles.v1.doctor"' "$report"
          done

          # Exercise the real workspace CLI through both freshly activated
          # shells, then independently compare its claims to native Git.
          env -u BASH_ENV bash --noprofile --norc -c '. "$1/.bashrc" || exit $?; agent_dotfiles workspace --root "$2"; agent_rc=$?; agent_deactivate || exit $?; exit "$agent_rc"' \
            fresh-bash "$prefix" "$GITHUB_WORKSPACE" > "$root/bash-workspace.json"
          env -u ZDOTDIR zsh -f -c 'source "$1/.zshrc" || exit $?; agent_dotfiles workspace --root "$2"; agent_rc=$?; agent_deactivate || exit $?; exit "$agent_rc"' \
            fresh-zsh "$prefix" "$GITHUB_WORKSPACE" > "$root/zsh-workspace.json"
          python3 - "$root/bash-workspace.json" "$root/zsh-workspace.json" "$CANDIDATE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          expected_root = str(Path(".").resolve())
          for path in sys.argv[1:3]:
              report = json.loads(Path(path).read_text())
              assert report["schema"] == "agent-dotfiles.v1.workspace"
              assert report["root"] == expected_root
              assert report["head"] == sys.argv[3]
              assert report["clean"] is True and report["truncated"] is False
              assert report["worktree_atomic"] is False
          PY

          ./install.sh verify --prefix "$prefix" --revision "$CANDIDATE_SHA" > "$root/verify-after.json"
          ./install.sh uninstall --prefix "$prefix" --revision "$CANDIDATE_SHA" > "$root/uninstall.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] is True and r["operation"] == "uninstall" and r["source_revision"] == sys.argv[2]' "$root/uninstall.json" "$CANDIDATE_SHA"
          test ! -e "$prefix"
          echo "Verified candidate $CANDIDATE_SHA: immutable install preview and manifest parity, Bash/Zsh doctor + native Git workspace identity, post-use verification, uninstall" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact-commit cold consumer receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cold-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-dotfiles-cold-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
