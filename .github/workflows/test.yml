name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source-tree artifact hygiene
        run: test -z "$(git ls-files docs/benchmarks docs/releases)"
      - name: Compile
        run: python -m compileall -q agent_dotfiles bin tests tools
      - name: Contract tests
        run: |
          test_status=0
          python -m unittest discover -s tests -v > contract-tests.log 2>&1 || test_status=$?
          cat contract-tests.log
          exit "$test_status"
      - name: Capability diagnostics
        if: always()
        run: python bin/agent-dotfiles doctor > capabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python-version }}-diagnostics
          path: |
            contract-tests.log
            capabilities.json

  macos-installation:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installation and source contracts on macOS
        run: python -m unittest discover -s tests -v

  shell-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shell validators
        run: sudo apt-get update -qq && sudo apt-get install -y zsh shellcheck
      - name: Static Bash analysis
        run: shellcheck --severity=warning -s bash install.sh shell/.bashrc shell/agent-functions.sh
      - name: Zsh syntax
        run: zsh -n shell/.zshrc shell/agent-functions.sh
      - name: Exercise installed Bash and Zsh profiles
        run: python3 -m unittest discover -s tests -p test_shell_dotfiles.py -v

  bashunit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Commit and release verified against the official annotated 0.50.1 tag.
      - uses: TypedDevs/bashunit@28ea63c467f1f461a6368c93e5c264051b141c6f # 0.50.1
        with:
          version: '0.50.1'
          verify-checksum: 'true'
      - name: Bashunit real-CLI integration tests
        run: bashunit test tests/shell --strict
