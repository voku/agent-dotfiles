name: mutation experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent_dotfiles/validation.py'
      - 'agent_dotfiles/cli.py'
      - 'tests/test_validation.py'
      - 'mutation.toml'
      - 'requirements-mutation.txt'
      - 'tools/mutation_report.py'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

jobs:
  mutation-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: 'requirements-mutation.txt'
      - name: Install pinned mutation runner
        run: python -m pip install -r requirements-mutation.txt
      - name: Baseline targeted unit tests
        run: python -m unittest discover -s tests -p test_validation.py -v
      - name: Initialize fresh mutation session
        run: cosmic-ray init mutation.toml mutation.sqlite
      - name: Execute mutations
        run: cosmic-ray exec mutation.toml mutation.sqlite
      - name: Generate evidence and summary
        run: |
          cosmic-ray dump mutation.sqlite > mutation-results.jsonl
          report_status=0
          python tools/mutation_report.py mutation-results.jsonl --markdown mutation-summary.md || report_status=$?
          if [ -f mutation-summary.md ]; then
            cat mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$report_status"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-guards
          path: |
            mutation.toml
            mutation.sqlite
            mutation-results.jsonl
            mutation-summary.md
          if-no-files-found: warn
          retention-days: 14
