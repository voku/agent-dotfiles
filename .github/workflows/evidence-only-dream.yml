name: Evidence-only owner Dream checkpoint

on:
  push:
    branches:
      - proof/owner-dream-20261011

permissions:
  contents: read

jobs:
  inspect-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pin reviewed dotfiles source
        uses: actions/checkout@v7
        with:
          repository: voku/agent-dotfiles
          ref: 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14
          path: product
          persist-credentials: false
      - name: Pin historical validated Learning evidence
        uses: actions/checkout@v7
        with:
          repository: voku/agent-dotfiles
          ref: 67c55b0940ba3e136032560d669870a16c3442b3
          path: historical
          persist-credentials: false
      - name: Pin current agent-loop owner runtime source
        uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: 38e71bf8c4dbc0702d26b235bfaea6726e33c12e
          path: owner
          persist-credentials: false
      - name: Setup PHP owner runtime
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Verify immutable sources and archive hash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14
          test "$(git -C historical rev-parse HEAD)" = 67c55b0940ba3e136032560d669870a16c3442b3
          test "$(git -C owner rev-parse HEAD)" = 38e71bf8c4dbc0702d26b235bfaea6726e33c12e
          cd historical
          sha256sum --check QUALITY-CYCLE-17-SHA256SUMS
      - name: Extract historical owner evidence without modifying the product
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/learning-corpus"
          tar -tzf historical/quality-cycle-17.tar.gz > reports/archive-paths.txt
          tar -xzf historical/quality-cycle-17.tar.gz -C "$RUNNER_TEMP/learning-corpus"
          find "$RUNNER_TEMP/learning-corpus" -type f \( -name config.json -o -name 'finding.*.json' \) | sort > reports/corpus-candidates.txt
          printf 'Archive entries: '; wc -l < reports/archive-paths.txt
          printf 'Learning-like files: '; wc -l < reports/corpus-candidates.txt
          grep -Ei 'learning|dream|finding' reports/archive-paths.txt | head -80 || true
          printf '\nOwner root configurations:\n'
          grep '/learning/config.json$' reports/corpus-candidates.txt || true
          {
            echo '### Evidence inventory, not a Dream result'
            echo 'Product: 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14'
            echo 'Owner: 38e71bf8c4dbc0702d26b235bfaea6726e33c12e'
            echo 'Archive hash: ba65b00703026679099f801b660f9266c3a04c24d0a747cfd899485bd59717fb'
            echo "Archive members: $(wc -l < reports/archive-paths.txt)"
            echo "Learning-like candidate files: $(wc -l < reports/corpus-candidates.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned agent-loop source dependencies in isolated owner checkout
        working-directory: owner
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          test -f vendor/autoload.php
          test -f composer.lock
          cp composer.lock ../reports/owner-composer.lock
          php -v | head -1 > ../reports/owner-php-version.txt
          composer --version >> ../reports/owner-php-version.txt
      - name: Verify expected historical owner refusals without rewriting Learning
        run: |
          set -euo pipefail
          mkdir -p reports/owner-dream
          owner="$GITHUB_WORKSPACE/owner/bin/agent-loop"
          corpus="$RUNNER_TEMP/learning-corpus/consumers"
          : > reports/owner-dream/outcomes.tsv
          for arm in A1 A2 B1 B2 C1 C2; do
            project="$corpus/$arm"
            learning="$project/.agent-loop/learning"
            test -f "$learning/config.json"
            # Preserve every file byte in the archived Learning owner tree.
            find "$learning" -type f -print0 | sort -z | xargs -0 sha256sum > "reports/owner-dream/$arm.before"
            set +e
            (cd "$project" && php "$owner" learn validate) > "reports/owner-dream/$arm.validate.log" 2>&1
            validated=$?
            if test "$validated" -eq 0; then
              (cd "$project" && php "$owner" learn dream --dry-run --format=json --report "$GITHUB_WORKSPACE/reports/owner-dream/$arm.report.json") > "reports/owner-dream/$arm.stdout.json" 2> "reports/owner-dream/$arm.stderr.txt"
              dream=$?
            else
              dream=125
            fi
            set -e
            find "$learning" -type f -print0 | sort -z | xargs -0 sha256sum > "reports/owner-dream/$arm.after"
            if ! cmp -s "reports/owner-dream/$arm.before" "reports/owner-dream/$arm.after"; then
              echo "Read-only invariant failed for $arm" >&2
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$arm" "$validated" "$dream" >> reports/owner-dream/outcomes.tsv
          done
          cat reports/owner-dream/outcomes.tsv
          {
            echo '### Read-only owner preview over six archived, independently governed arms'
            echo 'Source: exact pinned voku/agent-loop checkout'
            echo 'Inputs: SHA-verified historical quality-cycle-17 corpus'
            echo 'Each arm is validated before Dream; file SHA-256 manifests are compared afterward'
            echo 'This audit does not synthesize new findings or approve proposals'
            echo 'See outcomes.tsv and per-arm logs in the downloadable artifact'
          } >> "$GITHUB_STEP_SUMMARY"
          # Historical exports deliberately lack the complete original project.
          # Treat ONLY the exact previously observed six owner rejections as a
          # verified negative control. Any new failure, successful validation,
          # unexpected message or Learning source mutation must turn CI red.
          python3 - <<'PY'
          from pathlib import Path

          reports = Path("reports/owner-dream")
          expected = {
              "A1": ("finding.2026-10-11.c5ce5e", "missing task references"),
              "B1": ("finding.2026-10-11.6657bc", "missing task references"),
              "C1": ("finding.2026-10-11.c51ea2", "missing task references"),
              "A2": ("proposal.2026-08-14.007", "applied guidance target does not exist: MEMORY.md"),
              "B2": ("proposal.2026-08-14.007", "applied guidance target does not exist: MEMORY.md"),
              "C2": ("proposal.2026-08-14.007", "applied guidance target does not exist: MEMORY.md"),
          }
          rows = [line.split("\t") for line in (reports / "outcomes.tsv").read_text().splitlines()]
          assert len(rows) == len(expected), rows
          for arm, validated, dream in rows:
              assert arm in expected and validated == "1" and dream == "125", (arm, validated, dream)
              lines = (reports / f"{arm}.validate.log").read_text().strip().splitlines()
              record, error = expected.pop(arm)
              assert len(lines) == 1 and f"record {record}: {error}" in lines[0], (arm, lines)
              assert (reports / f"{arm}.before").read_bytes() == (reports / f"{arm}.after").read_bytes(), arm
          assert not expected, expected
          (reports / "classification.txt").write_text(
              "EXPECTED_INCOMPLETE_HISTORICAL_PROJECT\n"
              "6 exact owner precondition rejections; 0 historical Dream previews executed.\n"
              "Learning sources unchanged. This is NOT a completed governed Dream.\n"
          )
          PY
          cat reports/owner-dream/classification.txt
          {
            echo '### Historical negative-control classification'
            echo 'Six exactly matched owner validation rejections, as originally observed.'
            echo 'The archive omits tasks/ and guidance context needed by its Findings/Proposals.'
            echo 'Historical Dream: NOT EXECUTED; owner preconditions correctly refused it.'
            echo 'No Learning bytes were changed. This is not a green historic Dream claim.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain inventory for independent selection of validated roots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-learning-inventory-20261011
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  fresh-owner-dream:
    name: Fresh scaffold owner validation and Dream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pin immutable product source
        uses: actions/checkout@v7
        with:
          repository: voku/agent-dotfiles
          ref: 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14
          path: product
          persist-credentials: false
      - name: Pin actual agent-loop Dream owner
        uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: 38e71bf8c4dbc0702d26b235bfaea6726e33c12e
          path: owner
          persist-credentials: false
      - name: Prepare PHP 8.4 and Composer
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install pinned owner dependencies
        working-directory: owner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 38e71bf8c4dbc0702d26b235bfaea6726e33c12e
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          test -f vendor/autoload.php
      - name: Create isolated genuine scaffold, validate, and invoke Dream
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14
          mkdir -p reports/fresh-owner "$RUNNER_TEMP/fresh-product"
          # Copy the pinned source only. This is an independent temporary project
          # with a real Git repository; it does not rewrite the product checkout.
          git -C product archive HEAD | tar -xf - -C "$RUNNER_TEMP/fresh-product"
          git -C "$RUNNER_TEMP/fresh-product" init -q
          git -C "$RUNNER_TEMP/fresh-product" add -A
          git -C "$RUNNER_TEMP/fresh-product" -c user.name=Evidence \
            -c user.email=evidence@example.invalid commit -qm 'fixture: reviewed dotfiles source'
          owner="$GITHUB_WORKSPACE/owner/bin/agent-loop"
          fresh="$RUNNER_TEMP/fresh-product"
          (cd "$fresh" && php "$owner" init scaffold --prefix=DOTFILES) \
            > reports/fresh-owner/scaffold.log 2>&1
          test -d "$fresh/.agent-loop/tasks"
          test -d "$fresh/.agent-loop/learning/findings"
          (cd "$fresh" && php "$owner" learn validate) \
            > reports/fresh-owner/validate.log 2>&1
          # Dream is read-only with respect to Learning-owned source files.
          find "$fresh/.agent-loop/learning" -type f -print0 |
            sort -z | xargs -0r sha256sum > reports/fresh-owner/before.sha256
          (cd "$fresh" && php "$owner" learn dream --dry-run --format=json \
            --report "$GITHUB_WORKSPACE/reports/fresh-owner/dream.json") \
            > reports/fresh-owner/stdout.json 2> reports/fresh-owner/dream.stderr
          find "$fresh/.agent-loop/learning" -type f -print0 |
            sort -z | xargs -0r sha256sum > reports/fresh-owner/after.sha256
          cmp reports/fresh-owner/before.sha256 reports/fresh-owner/after.sha256
          python3 -m json.tool reports/fresh-owner/dream.json > /dev/null
          python3 -m json.tool reports/fresh-owner/stdout.json > /dev/null
          {
            echo '### Real fresh owner Dream execution'
            echo 'Product 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14'
            echo 'Loop owner 38e71bf8c4dbc0702d26b235bfaea6726e33c12e'
            echo 'A new repository was scaffolded through the pinned owner CLI.'
            echo 'Owner validate and Dream --dry-run succeeded; Learning source hashes unchanged.'
            echo 'This proves the runtime path, not historical findings validation or productive learning.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact Dream execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-owner-dream-20261011
          path: reports/fresh-owner/
          if-no-files-found: warn
          retention-days: 14

  cold-tool-consumer:
    name: Pinned install and real Bash-Zsh consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pin reviewed product source
        uses: actions/checkout@v7
        with:
          repository: voku/agent-dotfiles
          ref: 1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14
          path: product
          persist-credentials: false
      - name: Prepare independent runner capabilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh ripgrep
      - name: Preview install, exercise consumers, and remove pinned prefix
        run: |
          set -euo pipefail
          pin=1a4b388fbd6e50e2ecb5a4f001c1b254f7e46f14
          test "$(git -C product rev-parse HEAD)" = "$pin"
          prefix="$RUNNER_TEMP/agent-dotfiles-consumer"
          mkdir -p reports/consumer
          ./product/install.sh plan --prefix "$prefix" --revision "$pin" > reports/consumer/plan.json
          test ! -e "$prefix"
          ./product/install.sh install --prefix "$prefix" --revision "$pin" > reports/consumer/install.json
          ./product/install.sh verify --prefix "$prefix" --revision "$pin" > reports/consumer/verify.json
          if ! "$prefix/bin/agent-dotfiles" doctor --strict > reports/consumer/doctor.json; then
            cat reports/consumer/doctor.json
            exit 2
          fi
          cp "$prefix/installation.json" reports/consumer/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/consumer/plan.json").read_text())
          m = json.loads(Path("reports/consumer/manifest.json").read_text())
          assert p["source_revision"] == m["source_revision"]
          assert p["entries"] == m["files"], "plan must be byte-identical to installed manifest"
          assert len(p["entries"]) > 5
          PY
          env -u BASH_ENV bash --noprofile --norc -c \
            '. "$1/.bashrc" || exit $?; agent_dotfiles workspace --root "$2" > "$3"; agent_rc=$?; agent_deactivate || exit $?; exit "$agent_rc"' \
            runner "$prefix" "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/reports/consumer/bash.json"
          zsh -f -c \
            '. "$1/.zshrc" || exit $?; agent_dotfiles workspace --root "$2" > "$3"; agent_rc=$?; agent_deactivate || exit $?; exit "$agent_rc"' \
            runner "$prefix" "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/reports/consumer/zsh.json"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = subprocess.check_output(["git", "-C", "product", "rev-parse", "HEAD"], text=True).strip()
          for shell in ("bash", "zsh"):
              data = json.loads(Path(f"reports/consumer/{shell}.json").read_text())
              assert data["head"] == expected, (shell, data.get("head"))
              assert data["root"] == str(Path("product").resolve())
              assert data["clean"] is True and data["truncated"] is False, shell
          PY
          ./product/install.sh uninstall --prefix "$prefix" --revision "$pin" > reports/consumer/uninstall.json
          test ! -e "$prefix"
          {
            echo '### Actual pinned agent shell consumer execution'
            echo 'Verified SHA, manifest hash/mode parity, fresh Bash/Zsh workspace identity,'
            echo 'complete native Git identity match, namespace deactivation and uninstall.'
            echo 'No host startup files, global tools, release or network installer changed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish cold-consumer receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cold-consumer-evidence-20261011
          path: reports/consumer/
          if-no-files-found: warn
          retention-days: 14
