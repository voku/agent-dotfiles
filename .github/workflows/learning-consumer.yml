name: Project-local Learning and Recall consumer

on:
  pull_request:
    paths:
      - '.agent-loop/**'
      - 'MEMORY.md'
      - 'docs/decisions/**'
      - 'docs/recall-documents.json'
      - 'docs/REPOSITORY_LAYOUT.md'
      - 'tests/test_repository_ownership.py'
      - '.github/workflows/learning-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-agent-loop-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v7
        with:
          path: dotfiles
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable agent-loop owner
        uses: actions/checkout@v7
        with:
          repository: voku/agent-loop
          ref: fad403a209d7d9f4438bf7036ce962780f44938c
          path: agent-loop
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install owner runtime away from candidate
        run: composer install --working-dir=agent-loop --no-dev --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Validate actual external Learning root and retrieve project documents
        shell: bash
        env:
          EXPECTED_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/dotfiles"
          owner="$GITHUB_WORKSPACE/agent-loop"
          evidence="$RUNNER_TEMP/agent-loop-consumer-proof"
          mkdir -p "$evidence"
          test "$(git -C "$project" rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          test "$(git -C "$owner" rev-parse HEAD)" = fad403a209d7d9f4438bf7036ce962780f44938c
          php --version > "$evidence/php-version.txt"
          composer --version > "$evidence/composer-version.txt"
          cp "$owner/composer.lock" "$evidence/owner-dependencies.lock"
          printf '%s\n' "$EXPECTED_CANDIDATE" > "$evidence/candidate-sha.txt"
          printf '%s\n' fad403a209d7d9f4438bf7036ce962780f44938c > "$evidence/owner-sha.txt"
          test -z "$(git -C "$project" status --porcelain=v1 --untracked-files=all)"
          (
            cd "$project"
            php "$owner/bin/agent-loop" learn validate --root "$project/.agent-loop/learning" \
              > "$evidence/learning-validation.txt" 2>&1
            php "$owner/bin/agent-loop" recall compile \
              --root "$project/.agent-loop/learning" \
              --task DOTFILES-CONSUMER-PROOF \
              --description 'Inspect safe agent-owned runtime and reviewed project decisions' \
              --file shell/core/activation.sh \
              --document-manifest "$project/docs/recall-documents.json" \
              --output-dir "$evidence/recall" \
              > "$evidence/recall-compile.txt" 2>&1
          )
          # Verify that agent-loop itself resolves the manifest from project
          # configuration, not merely because the CLI was passed a path.
          php -r '
            require $argv[1];
            $actual = (new \voku\AgentLoop\ProjectLayout($argv[2]))->recallDocumentManifests();
            if ($actual !== [$argv[3]]) {
                fwrite(STDERR, "Owner did not resolve project-local Recall manifest.\n");
                exit(2);
            }
            echo $actual[0], "\n";
          ' "$owner/vendor/autoload.php" "$project" "$project/docs/recall-documents.json" \
            > "$evidence/configured-recall-path.txt"
          grep -F 'Validated agent learning root:' "$evidence/learning-validation.txt"
          grep -R -F -q 'One owner per file' "$evidence/recall"
          grep -R -F -q 'No implicit' "$evidence/recall" || grep -R -F -q 'private-prefix' "$evidence/recall"
          test -z "$(git -C "$project" status --porcelain=v1 --untracked-files=all)"
          # Negative control in an isolated scratch copy: fail closed on malformed config.
          scratch="$RUNNER_TEMP/invalid-learning-project"
          mkdir -p "$scratch/.agent-loop"
          cp -R "$project/.agent-loop/learning" "$scratch/.agent-loop/learning"
          printf '{' > "$scratch/.agent-loop/learning/config.json"
          if php "$owner/bin/agent-loop" learn validate --root "$scratch/.agent-loop/learning" \
              > "$evidence/invalid-learning.txt" 2>&1; then
            echo 'Invalid Learning config unexpectedly accepted' >&2
            exit 1
          fi
          test -s "$evidence/invalid-learning.txt"
          # The Learning owner must also be able to persist an unverified
          # candidate in its *project-local* storage. Keep it in scratch and
          # never promote synthetic CI evidence into tracked project memory.
          candidate_root="$RUNNER_TEMP/finding-capture-project"
          mkdir -p "$candidate_root/.agent-loop"
          cp -R "$project/.agent-loop/learning" "$candidate_root/.agent-loop/learning"
          # Create a pre-existing owner-generated Finding in scratch so this
          # regression tests coexistence with retained Learning state, rather
          # than accidentally relying on an empty repository.
          php "$owner/bin/agent-loop" learn capture \
            --root "$candidate_root/.agent-loop/learning" \
            --task DOTFILES-9998 \
            --by ci-contract \
            --scope shell/modules/git.sh \
            --observation 'CI fixture only: earlier Finding in the same local root' \
            --hypothesis 'Earlier owner records remain unchanged by later tasks' \
            --evidence 'Synthetic pre-existing record, not an approved decision' \
            > "$evidence/preexisting-capture.json"
          python3 - "$candidate_root/.agent-loop/learning" "$evidence/before-findings.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          existing = sorted(p.relative_to(root).as_posix()
                            for p in (root / "findings").rglob("*.json"))
          assert existing, "the fixture must begin with existing Findings"
          Path(sys.argv[2]).write_text(json.dumps(existing), encoding="utf-8")
          PY
          php "$owner/bin/agent-loop" learn capture \
            --root "$candidate_root/.agent-loop/learning" \
            --task DOTFILES-9999 \
            --by ci-contract \
            --scope shell/core/activation.sh \
            --observation 'CI fixture only: project-local candidate writes are possible' \
            --hypothesis 'Learning writes unverified candidates under the supplied root' \
            --evidence 'Synthetic integration probe, not a real workflow outcome' \
            > "$evidence/candidate-capture.json"
          python3 - "$evidence/candidate-capture.json" "$candidate_root/.agent-loop/learning" "$evidence/before-findings.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = Path(sys.argv[2]).resolve()
          before = set(json.loads(Path(sys.argv[3]).read_text(encoding="utf-8")))
          current = {p.relative_to(root).as_posix()
                     for p in (root / "findings").rglob("*.json")}
          created = current - before
          assert len(created) == 1, (before, created)
          assert before <= current, "older records disappeared"
          created_path = root / next(iter(created))
          finding = json.loads(created_path.read_text(encoding="utf-8"))
          assert finding["id"] == receipt["id"], receipt
          assert Path(receipt["path"]).resolve() == created_path.resolve(), receipt
          assert finding["task_id"] == "DOTFILES-9999", finding
          assert finding["status"] == "candidate", finding
          assert finding["validation_status"] == "unverified", finding
          PY
          php "$owner/bin/agent-loop" learn validate --root "$candidate_root/.agent-loop/learning" \
            > "$evidence/candidate-validation.txt" 2>&1
          test -z "$(git -C "$project" status --porcelain=v1 --untracked-files=all)"
          echo 'Real agent-loop Learning validates, its Recall documents are compiled, and an isolated unverified Finding is persisted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload independently inspectable owner receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-learning-consumer
          path: ${{ runner.temp }}/agent-loop-consumer-proof/
          if-no-files-found: warn
          retention-days: 14
